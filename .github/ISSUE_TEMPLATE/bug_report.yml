name: Bug report
description: Something in Free Roam doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Free Roam version
      description: Select Free Roam in Finder and choose File → Get Info.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "15.2"
    validations:
      required: true
  - type: dropdown
    id: player
    attributes:
      label: Which app do you play from?
      options:
        - "Music, with an Apple Music subscription"
        - "Music, with songs I own"
        - "Spotify Premium"
        - "Spotify Free"
    validations:
      required: true
  - type: checkboxes
    id: permissions
    attributes:
      label: Permissions you've allowed
      options:
        - label: Control Music or Spotify (System Settings → Privacy & Security → Automation)
        - label: Screen Recording
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Optional. Run this in Terminal, reproduce the problem, then paste the output: `log stream --predicate 'subsystem == \"com.happys1ngh.freeroam\"'`"
      render: text
