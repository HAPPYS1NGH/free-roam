<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Embed probe</title>
  <style>body { margin: 16px; background: #111; color: #eee; font: 14px system-ui; } #player { width: 480px; height: 270px; }</style>
</head>
<body>
  <!-- Served over http://127.0.0.1 by embed-check.mjs so the embed gets a Referer. -->
  <button type="button" id="start">Start</button>
  <div id="player"></div>
  <script>
    let player = null
    let pending = null
    window.__ready = false

    window.onYouTubeIframeAPIReady = () => {
      player = new YT.Player("player", {
        width: 480, height: 270,
        host: "https://www.youtube-nocookie.com",
        playerVars: { playsinline: 1, rel: 0, origin: location.origin },
        events: {
          onReady: () => { window.__ready = true },
          onError: event => settle({ embeddable: false, errorCode: event.data }),
        },
      })
    }

    function settle(result) {
      if (!pending) return
      const { resolve, timer, videoId } = pending
      pending = null
      clearTimeout(timer)
      let ytDuration = null, ytTitle = null
      try { ytDuration = Math.round(player.getDuration()) || null; ytTitle = player.getVideoData().title || null } catch {}
      player.stopVideo()
      resolve({ videoId, ...result, ytDuration, ytTitle })
    }

    // Resolves once the video actually plays in the embed, or the player errors.
    window.probe = videoId => new Promise(resolve => {
      const timer = setTimeout(() => settle({ embeddable: false, errorCode: "timeout" }), 20000)
      pending = { resolve, timer, videoId }
      player.mute()
      player.loadVideoById({ videoId, startSeconds: 20 })
      // PLAYING can fire before time advances; poll so a real play is required.
      const poll = setInterval(() => {
        if (!pending || pending.videoId !== videoId) return clearInterval(poll)
        if (player.getPlayerState() === 1 && player.getCurrentTime() > 20.3) { clearInterval(poll); settle({ embeddable: true }) }
      }, 250)
    })
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
