<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101514" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/sofia-sans-extra-condensed/latin-600.woff2" as="font" type="font/woff2" crossorigin />
    <title>Page not found | Free Roam</title>
    <style>
      @font-face {
        font-family: "Sofia Condensed";
        src: url("/fonts/sofia-sans-extra-condensed/latin-600.woff2") format("woff2");
        font-weight: 600;
        font-display: swap;
      }
      :root { color-scheme: dark; --ink: #ede9dd; --muted: #c4c8c0; --accent: #d5df99; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        align-content: center;
        padding: 48px max(20px, env(safe-area-inset-right)) 48px max(20px, env(safe-area-inset-left));
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        color: var(--ink);
        background: linear-gradient(90deg, #081116e6, #08111699 60%, #08111640), url("/free-roam/coast.jpg") 62% center / cover, #101514;
        -webkit-font-smoothing: antialiased;
      }
      main { width: min(1280px, 100%); margin-inline: auto; }
      p { margin: 0; line-height: 1.6; text-wrap: pretty; }
      .eyebrow { font: 600 17px/1.2 "Sofia Condensed", Impact, sans-serif; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
      h1 { margin: 18px 0 26px; font: 600 clamp(82px, 10vw, 158px)/.81 "Sofia Condensed", Impact, sans-serif; text-transform: uppercase; letter-spacing: -1.5px; }
      h1 span { color: var(--accent); }
      .intro { max-width: 32ch; font-size: clamp(18px, 1.7vw, 23px); line-height: 1.45; color: #e1e0d6; }
      a { display: inline-flex; align-items: center; min-height: 52px; margin-top: 32px; padding: 0 26px; border-radius: 3px; background: var(--accent); color: #1d281c; font-size: 14px; font-weight: 600; text-decoration: none; transition: background-color 150ms; }
      a:focus-visible { outline: 2px solid var(--ink); outline-offset: 5px; }
      @media (hover: hover) and (pointer: fine) { a:hover { background: color-mix(in oklch, var(--accent), white 15%); } }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404 · Off the map</p>
      <h1>Wrong<br />turn<span>.</span></h1>
      <p class="intro">There's nothing at this address. The radio's still on back at the start.</p>
      <a href="/">Back to Free Roam</a>
    </main>
  </body>
</html>
