<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090f16" />
    <meta name="description" content="Hold ⌥Q anywhere on your Mac and flick between your Spotify or Apple Music playlists, like the radio when you free roam. Free and open source." />
    <meta property="og:title" content="Free Roam | Switch Spotify or Apple Music playlists from anywhere on your Mac" />
    <meta property="og:description" content="Hold ⌥Q anywhere on your Mac and flick between your Spotify or Apple Music playlists, like the radio when you free roam. Free and open source." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/free-roam/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A coupe on a coastal highway at twilight, beside the words Hold ⌥Q anywhere. Your playlists, as radio stations." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image:alt" content="A coupe on a coastal highway at twilight, beside the words Hold ⌥Q anywhere. Your playlists, as radio stations." />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/sofia-sans-extra-condensed/latin-600.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Picks the hero's coast photo for the visitor's hour before first paint,
      // so only that one loads. Keep in step with timeOfDay() in Hero.tsx.
      (function () {
        var hour = new Date().getHours()
        var time = hour >= 5 && hour < 8 ? "dawn" : hour >= 8 && hour < 17 ? "day" : hour >= 17 && hour < 20 ? "dusk" : "night"
        document.documentElement.dataset.time = time
        var link = document.createElement("link")
        link.rel = "preload"
        link.as = "image"
        link.href = "/free-roam/scenes/coast-" + time + ".jpg"
        link.setAttribute("fetchpriority", "high")
        document.head.appendChild(link)
        // The intro plays once per session. It's CSS on prerendered markup, so the
        // flag has to land before first paint. Storage can throw in private modes.
        try {
          if (sessionStorage.getItem("free-roam-intro")) document.documentElement.dataset.intro = "seen"
          else sessionStorage.setItem("free-roam-intro", "1")
        } catch (error) {}
      })()
    </script>
    <title>Free Roam | Switch Spotify or Apple Music playlists from anywhere on your Mac</title>
  </head>
  <body>
    <noscript><style>.ta-try { display: none; }</style></noscript>
    <div id="root"></div>
    <script type="module" src="/src/free-roam/main.tsx"></script>
  </body>
</html>
